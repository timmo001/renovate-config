---
name: Validate

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preset:
    name: Renovate config
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d  # v5.2.4
      - name: Validate preset
        run: mise run check

  lint:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-general.yml@de4221cd9b24ad3d61aa1db87b6e4864cf56d5a1 # 20261027.0
