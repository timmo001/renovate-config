---
name: Validate

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preset:
    name: Renovate config
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7  # v5.2.0
      - name: Validate preset
        run: mise run check

  lint:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-general.yml@996dd60d03b12f28b482074a9eed7083a18e2439 # 20261013.1
