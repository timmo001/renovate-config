[tools]
node = "24"
"npm:prettier" = "3.10.1"
hk = "2.14.0"
pkl = "0.33.1"
"npm:markdownlint-cli2" = "0.24.2"
"pipx:yamllint" = "1.38.0"
# mise needs uv 0.12.10 or later to install from the Python dependency lock
uv = "0.13.10"
actionlint = "1.7.12"
shellcheck = "0.11.0"

[tools."npm:renovate"]
version = "44.262.1"
# re2 downloads its native build, which Renovate uses to validate regexes
allow_builds = ["re2"]
# @yarnpkg/libzip 3.2.2 was published by arcanis from yarnpkg/berry without provenance
trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"]

[tasks.format]
description = "Format the repository with Prettier"
run = "prettier --write ."

[tasks."format:check"]
description = "Check formatting without writing"
run = "prettier --check ."

[tasks.check]
description = "Validate the shared Renovate preset"
run = "renovate-config-validator --strict --no-global default.json"
